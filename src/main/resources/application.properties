spring.application.name=docelivery

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=docelivery;encrypt=true;trustServerCertificate=true
spring.datasource.username=SA
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

logging.level.org.springframework.boot.autoconfigure.security=INFO
spring.security.user.name=admin
spring.security.user.password=admin123

api.security.token.secret=${JWT_SECRET:EssaEhUmaSenhaSuperSecretaDoCaiqueParaODocelivery2026}

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload.dir=C:/docelivery-storage/
app.upload.path=C:/docelivery-storage/
app.base-url=http://192.168.1.102:8080